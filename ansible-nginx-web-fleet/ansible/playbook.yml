---
- name: Install and start NGINX
  hosts: webservers
  become: yes
  tasks:
    - name: Update dnf cache
      dnf:
        update_cache: yes

    - name: Install NGINX
      dnf:
        name: nginx
        state: present

    - name: Ensure NGINX is running
      service:
        name: nginx
        state: started
        enabled: yes
